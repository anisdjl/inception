version: '3.8'

services:

  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb
    restart: always
    env_file:
      - .env
    secrets:
      - DB_USER_PASSWORD
      - DB_ROOT_PASSWORD
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception_network

  wordpress:
    container_name: wordpress
    build:
        context: ./requirements/wordpress
        dockerfile: Dockerfile
    image: wordpress
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    secrets:
      - DB_USER_PASSWORD
      - credentials
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network
    
  nginx:
    container_name: nginx
    build:
        context: ./requirements/nginx
        dockerfile: Dockerfile
    image: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - 443:443
    volumes:
      - wp_data:/var/www/wordpress
    networks:
      - inception_network
  
  redis:
    container_name: redis
    build:
        context: ./requirements/bonus/redis
        dockerfile: Dockerfile
    image: redis
    restart: always
    networks:
      - inception_network

  ftp:
    container_name: ftp
    build:
        context: ./requirements/bonus/ftp
        dockerfile: Dockerfile
    image: ftp
    restart: always
    ports:
      - "21:21"
      - "40000-40005:40000-40005"
    volumes:
      - wp_data:/var/www/wordpress
    env_file:
      - .env
    secrets:
      - FTP_PASSWORD
    networks:
      - inception_network

secrets:
  DB_USER_PASSWORD:
    file: ../secrets/db_password.txt
  DB_ROOT_PASSWORD:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  FTP_PASSWORD:
    file: ../secrets/ftp_password.txt

volumes:
  db_data:
    name: db_data
    driver: local
    driver_opts:
      type: none
      device: /home/adjelili/data/mariadb
      o: bind

  wp_data:
    name: wp_data
    driver: local
    driver_opts:
      type: none
      device: /home/adjelili/data/wordpress
      o: bind
networks:
  inception_network:
    driver: bridge